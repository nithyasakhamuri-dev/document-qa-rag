<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Q&amp;A using RAG</title>
<style>
  body { font-family: Arial, sans-serif; background: #f6f3ec; color: #14193a; margin: 0; }
  main { max-width: 760px; margin: 40px auto; padding: 0 20px; }
  h1 { margin-bottom: 4px; }
  .card { background: #fff; border: 1px solid #e0dacb; border-radius: 12px; padding: 20px; margin-top: 20px; }
  button { background: #0f7c84; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 15px; }
  input[type=text] { width: 70%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
  .source { background: #f6f3ec; border-left: 4px solid #f5a623; padding: 8px 12px; margin-top: 8px; font-size: 14px; }
  #status { margin-top: 10px; color: #46506b; }
</style>
</head>
<body>
<main>
  <h1>Document Q&amp;A using RAG</h1>
  <p>Upload a PDF or TXT file, then ask questions about it.</p>

  <div class="card">
    <h3>1. Upload a document</h3>
    <input type="file" id="file" accept=".pdf,.txt">
    <button onclick="upload()">Upload</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <h3>2. Ask a question</h3>
    <input type="text" id="question" placeholder="e.g. What is this document about?">
    <button onclick="ask()">Ask</button>
    <div id="answer"></div>
  </div>
</main>

<script>
  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  async function upload() {
    const f = document.getElementById("file").files[0];
    if (!f) { document.getElementById("status").textContent = "Choose a file first."; return; }
    const data = new FormData();
    data.append("file", f);
    const res = await fetch("/upload", { method: "POST", body: data });
    const json = await res.json();
    document.getElementById("status").textContent = json.message || json.error;
  }

  async function ask() {
    const q = document.getElementById("question").value;
    const box = document.getElementById("answer");
    box.innerHTML = "<p>Thinking...</p>";
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q }),
    });
    const json = await res.json();
    if (json.error) { box.innerHTML = "<p>" + esc(json.error) + "</p>"; return; }
    let html = "<h4>Answer</h4><p>" + esc(json.answer) + "</p><h4>Source passages</h4>";
    json.sources.forEach(function (s, i) {
      html += '<div class="source">[' + (i + 1) + "] (similarity " + s.score + ") " + esc(s.text) + "</div>";
    });
    box.innerHTML = html;
  }
</script>
</body>
</html>
